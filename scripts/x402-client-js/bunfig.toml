# Bun configuration for X402 Solana client

[install]
# Use exact versions for better reproducibility
exact = true

# Cache dependencies
cache = true

[install.scopes]
# Configure package resolution

[run]
# Use Bun's runtime instead of Node.js
bun = true

# Enable watch mode for development
# hot = true

[test]
# Test configuration (if needed in the future)
preload = ["./test/setup.ts"]

[loader]
# Handle different file types
".ts" = "ts"
".tsx" = "tsx"
".js" = "js"
".jsx" = "jsx"

# Module resolution
[module]
# Prefer ES modules
preferESM = true
